<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Grupo Jet — malha</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>html,body,#map{height:100%;margin:0;background:#000}
.top{position:absolute;z-index:500;left:16px;top:16px;color:#fff;font-family:system-ui;background:#000c;padding:12px 14px;border-radius:12px;border:1px solid #ffffff22}
.top b{color:#FF6600}</style></head>
<body>
<div id="map"></div>
<aside class="top"><b>GRUPO JET</b><div>Malha óptica + OPGW BSB–Palmas</div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const lines=[
[[-46.81,-23.494],[-46.63,-23.55],[-47.81,-21.18],[-47.95,-19.76],[-48.27,-18.91],[-48.16,-17.73],[-47.70,-16.92],[-47.88,-15.79]],
[[-47.88,-15.79],[-47.93,-15.79],[-48.05,-15.45],[-48.25,-15.10],[-48.40,-14.70],[-48.46,-14.47],[-48.30,-13.83],[-48.22,-13.53],[-48.40,-13.04],[-48.17,-12.62],[-48.54,-12.25],[-48.80,-11.95],[-49.07,-11.73],[-48.90,-11.35],[-48.55,-10.90],[-48.42,-10.71],[-48.33,-10.18]],
[[-47.88,-15.79],[-47.66,-15.60],[-47.34,-15.54],[-46.86,-17.23],[-46.13,-17.78]],
[[-48.16,-17.73],[-49.06,-17.73],[-49.92,-16.81],[-50.89,-17.79],[-51.73,-17.89],[-52.55,-17.56],[-53.22,-17.32],[-53.53,-16.95],[-54.63,-16.48],[-54.97,-15.96],[-56.09,-15.60]],
[[-47.81,-21.18],[-47.47,-22.49],[-46.81,-23.49]]
];
const map=L.map('map').setView([-16.5,-48.5],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
const layer=L.layerGroup().addTo(map);
lines.forEach((c,i)=>L.polyline(c.map(([lng,lat])=>[lat,lng]),{color:'#FF6600',weight:i===1?3:1.6,opacity:.9}).addTo(layer));
map.fitBounds(layer.getBounds(),{padding:[24,24]});
</script></body></html>
