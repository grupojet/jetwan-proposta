<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Jet · Colégio WR At Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080f;--ink:#f4f6fb;--mute:#93a0b5;--line:rgba(255,255,255,.1);--jet:#ff6a00;--jet2:#ff8a33}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0 0 92px 0}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease;display:flex;align-items:center}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.bg{position:absolute;inset:0;background:#0b1220 center/cover no-repeat;filter:brightness(.42)}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,#06080f 7%,#06080fd0 48%,#06080f40 100%)}
.inner{position:relative;z-index:2;width:min(1160px,92%);margin:0 auto}
.k{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--jet2);text-transform:uppercase;margin-bottom:12px}
h1,.h1{font-size:clamp(30px,5vw,56px);line-height:.98;letter-spacing:-.035em;font-weight:800;max-width:16ch;margin-bottom:14px}
h2{font-size:clamp(24px,3.6vw,40px);letter-spacing:-.03em;font-weight:700;margin-bottom:12px;max-width:20ch}
.lede{font-size:clamp(15px,1.6vw,19px);color:var(--mute);font-weight:300;max-width:620px;line-height:1.55}
.caption{margin-top:18px;max-width:660px;font-size:14px;color:#d7deea;background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:3px solid var(--jet);padding:11px 14px;border-radius:0 12px 12px 0}
.grid{display:grid;gap:12px;margin-top:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:15px;margin-bottom:5px}.card p{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;margin-bottom:8px}
.t-amber{background:#f59e0b22;color:#fbbf24}.t-blue{background:#3b82f622;color:#60a5fa}
.t-green{background:#22c55e22;color:#4ade80}.t-jet{background:#ff6a0022;color:var(--jet2)}.t-sky{background:#0ea5e922;color:#38bdf8}
.price{font-size:clamp(34px,5vw,54px);font-weight:800}.price small{font-size:16px;color:var(--mute);font-weight:500}
.pill{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}.pill b{color:#fff}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:14px 20px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--jet)}
.dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.2);cursor:pointer}
.dots button.on{background:var(--jet)}
.player{position:fixed;left:0;right:0;bottom:0;height:92px;z-index:40;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0b101c;border-top:1px solid var(--line)}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--jet);color:#fff;cursor:pointer}
.seek{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.1);cursor:pointer;overflow:hidden}
.seek i{display:block;height:100%;width:0;background:var(--jet)}
.navbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#fff;cursor:pointer}
.hint{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(6,8,15,.62)}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}.dots{display:none}}
</style></head><body>
<div class="top"><div class="brand"><span class="dot"></span> GRUPO JET · WR At Home</div><div id="chap">01</div></div>
<div class="dots" id="dots"></div>
<div class="stage" id="stage"></div>
<div class="player">
<button class="navbtn" onclick="jump(-1)">‹</button>
<button class="play" id="playBtn" onclick="toggle()">▶</button>
<button class="navbtn" onclick="jump(1)">›</button>
<div class="seek" onclick="seekTo(event)"><i id="sfill"></i></div>
</div>
<div class="hint" id="hint"><div class="box"><h2>Acompanhe com o áudio</h2><button class="play" style="width:auto;padding:0 22px;border-radius:999px" onclick="start()">▶ Começar</button></div></div>
<audio id="audio" preload="auto" src="https://cdn.kairogen.ai/audio-generations/6a9f53f0283c2ce5cb1b23c5/6ab1624a399d4861993d853e/speech.mp3"></audio>
<script>
const DATA=[
{t:0,l:"01 · Abertura",title:"Streaming próprio para o WR At Home.",lede:"Do estúdio do Colégio WR até a casa do aluno — sem tela preta.",h1:1,cap:"Olá, Saulo. Aqui está a proposta do Grupo Jet para o Colégio WR At Home.",bg:"https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=1600&q=70"},
{t:8,l:"02 · Percurso",title:"Do estúdio até o aluno em casa.",lede:"A aula sai do WR, entra no datacenter Jet e chega no notebook do aluno.",cap:"Vamos mostrar como a solução funciona.",bg:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=70"},
{t:16,l:"03 · Topologia",title:"Três caminhos. Um sinal.",lede:"Fibra 1, Fibra 2 e Starlink ao mesmo tempo. Se um oscila, os outros assumem.",cap:"Três caminhos independentes: duas fibras e Starlink.",bg:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1600&q=70"},
{t:28,l:"04 · Failover",title:"Se um caminho cair, os outros assumem.",lede:"Os três caminhos ficam vivos o tempo todo.",cards:[["t-amber","Ingest A","Fibra 1","Caminho primário."],["t-sky","Ingest B","Fibra 2","Rota independente."],["t-green","Ingest C","Starlink","Backup via satélite."]],cap:"Failover em segundos, sem o aluno perceber.",bg:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1600&q=70"},
{t:38,l:"05 · Qualidade",title:"Várias qualidades ao mesmo tempo.",lede:"1080p, 720p e 480p. O player escolhe sozinho.",g3:1,cards:[["t-blue","1080p","Fibra boa","Alta qualidade."],["t-blue","720p","Média","Desce sozinha."],["t-blue","480p","Wi-Fi fraco","A aula continua."]],cap:"Transcodificação adaptativa no datacenter Jet.",bg:"https://images.unsplash.com/photo-1544197150-b99a5804f82b?auto=format&fit=crop&w=1600&q=70"},
{t:47,l:"06 · Monitoramento",title:"Saber se o problema é nosso ou da casa do aluno.",lede:"No login medimos a última milha. Na aula o player manda telemetria.",g3:1,cards:[["t-jet","No login","Probe de 3s","Latência e banda até o datacenter Jet."],["t-blue","Na aula","Telemetria","Buffer, travamento e operadora."],["t-green","No painel","Diagnóstico","Um aluno = casa dele. Muitos = nosso lado."]],cap:"Sem túnel na casa do aluno.",bg:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1600&q=70"},
{t:50,l:"07 · Agentes IA",title:"Agentes especialistas reportam o que importa.",lede:"Três agentes leem a telemetria o tempo todo. O WR recebe o diagnóstico pronto. O time Jet só entra quando o problema é nosso.",g3:1,cards:[["t-jet","Diagnóstico","Agente QoE","Separa casa do aluno de falha do serviço."],["t-blue","Ao vivo","Agente de incidente","Alerta no minuto se a turma começar a travar."],["t-green","Pós-aula","Agente de relatório","Resumo no WhatsApp: o que foi nosso e o que foi última milha."]],cap:"IA de operação. Não escuta o conteúdo da aula.",bg:"https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1600&q=70"},
{t:52,l:"08 · Gravação",title:"Se o ao vivo cair, a aula não para.",lede:"Toda aula grava em paralelo. O aluno cai na gravação sem interrupção.",cards:[["t-green","Ao vivo","Stream","Qualidade adaptativa."],["t-green","Fallback","Gravação","O player troca sozinho."]],cap:"Gravação automática com fallback.",bg:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=70"},
{t:62,l:"09 · Disaster recovery",title:"Se o local cair, a Digital Ocean assume.",lede:"Replicação contínua. O DNS redireciona.",cap:"Disaster recovery na Digital Ocean.",bg:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1600&q=70"},
{t:73,l:"10 · Comercial",title:"R$ 7.800 / mês · piso",lede:"Mínimo mensal mais taxa por aluno ativo.",price:1,cap:"Piso + por aluno.",bg:"https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1600&q=70"},
{t:82,l:"11 · Cronograma",title:"MVP em quinze dias.",lede:"Piloto e go-live em cerca de 25 dias.",g3:1,cards:[["t-jet","Dias 1–15","MVP","Ingest, origin e player."],["t-jet","+5 dias","Piloto","Uma turma real."],["t-jet","+5 dias","Go-live","Abertura geral."]],cap:"Qualquer dúvida, é só falar.",bg:"https://images.unsplash.com/photo-1524178232363-1fb2b075b622?auto=format&fit=crop&w=1600&q=70"}
];
const stage=document.getElementById("stage");
DATA.forEach((s,i)=>{const el=document.createElement("section");el.className="slide"+(i===0?" on":"");let extra="";if(s.cards)extra+=`<div class="grid ${s.g3?"g3":"g2"}">${s.cards.map(c=>`<div class="card"><span class="tag ${c[0]}">${c[1]}</span><h3>${c[2]}</h3><p>${c[3]}</p></div>`).join("")}</div>`;if(s.price)extra=`<div class="price">R$ 7.800 <small>/mês · piso</small></div><div class="card" style="max-width:520px;margin-top:16px"><div class="pill"><span>Piso</span><b>1.000 alunos</b></div><div class="pill"><span>Por aluno acima</span><b>R$ 5 a R$ 10</b></div><div class="pill"><span>3.000 alunos</span><b>~ R$ 24 mil</b></div></div>`;el.innerHTML=`<div class="bg" style="background-image:url('${s.bg}')"></div><div class="veil"></div><div class="inner"><div class="k">${s.l}</div>${s.h1?`<h1>${s.title}</h1>`:`<h2>${s.title}</h2>`}<p class="lede">${s.lede||""}</p>${extra}<div class="caption">${s.cap}</div></div>`;stage.appendChild(el);});
const slides=[...document.querySelectorAll(".slide")];const times=DATA.map(s=>s.t);const audio=document.getElementById("audio");const dots=document.getElementById("dots");let idx=0,dur=86;
DATA.forEach((s,i)=>{const b=document.createElement("button");b.onclick=()=>go(i,true);dots.appendChild(b);});
function go(i,seekA){idx=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.classList.toggle("on",n===idx));[...dots.children].forEach((d,n)=>d.classList.toggle("on",n===idx));document.getElementById("chap").textContent=DATA[idx].l;if(seekA){audio.currentTime=times[idx]+0.05;if(audio.paused)toggle();}}
function toggle(){if(audio.paused){audio.play();playBtn.textContent="⏸";}else{audio.pause();playBtn.textContent="▶";}}
function start(){document.getElementById("hint").style.display="none";audio.play();playBtn.textContent="⏸";}
function jump(d){go(idx+d,true)}
function seekTo(e){const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*dur}
audio.addEventListener("timeupdate",()=>{const t=audio.currentTime;document.getElementById("sfill").style.width=(t/dur*100)+"%";let n=0;for(let k=0;k<times.length;k++)if(t>=times[k]-0.04)n=k;if(n!==idx)go(n,false);});
go(0,false);
</script></body></html>
