<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Jet · Colégio WR At Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080f;--ink:#f4f6fb;--mute:#93a0b5;--line:rgba(255,255,255,.1);--jet:#ff6a00;--jet2:#ff8a33}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0 0 92px 0}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease;display:flex;align-items:center}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.bg{position:absolute;inset:0;background:#0b1220 center/cover no-repeat;filter:brightness(.42) saturate(1.05)}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,#06080f 7%,#06080fd0 48%,#06080f40 100%)}
.veil.full{background:linear-gradient(180deg,#06080fef,#06080f70 50%,#06080fef)}
.inner{position:relative;z-index:2;width:min(1160px,92%);margin:0 auto}
.k{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--jet2);text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(30px,5vw,60px);line-height:.98;letter-spacing:-.035em;font-weight:800;max-width:16ch;margin-bottom:14px}
h2{font-size:clamp(24px,3.6vw,42px);letter-spacing:-.03em;font-weight:700;margin-bottom:12px;max-width:18ch}
.lede{font-size:clamp(15px,1.6vw,19px);color:var(--mute);font-weight:300;max-width:560px;line-height:1.55}
.caption{margin-top:18px;max-width:660px;font-size:14px;color:#d7deea;background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:3px solid var(--jet);padding:11px 14px;border-radius:0 12px 12px 0}
.grid{display:grid;gap:12px;margin-top:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(8px)}
.card h3{font-size:15px;margin-bottom:5px}.card p{font-size:13px;color:var(--mute);line-height:1.45}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;margin-bottom:8px}
.t-amber{background:#f59e0b22;color:#fbbf24}.t-blue{background:#3b82f622;color:#60a5fa}
.t-green{background:#22c55e22;color:#4ade80}.t-jet{background:#ff6a0022;color:var(--jet2)}
.t-sky{background:#0ea5e922;color:#38bdf8}
.price{font-size:clamp(34px,5vw,54px);font-weight:800;letter-spacing:-.04em}
.price small{font-size:16px;color:var(--mute);font-weight:500}
.pill{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.pill b{color:#fff}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--jet);box-shadow:0 0 10px var(--jet)}
.meta{font-size:11px;color:var(--mute)}
.dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.2);cursor:pointer}
.dots button.on{background:var(--jet);transform:scale(1.25)}
.prog{position:fixed;left:0;right:0;bottom:92px;height:3px;background:rgba(255,255,255,.08);z-index:30}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--jet),var(--jet2))}
.player{position:fixed;left:0;right:0;bottom:0;height:92px;z-index:40;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0b101c;border-top:1px solid var(--line)}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--jet);color:#fff;font-size:18px;cursor:pointer;flex:none}
.seek{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.1);cursor:pointer;overflow:hidden}
.seek i{display:block;height:100%;width:0;background:var(--jet)}
.time{font-size:12px;color:var(--mute);min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.navbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#fff;cursor:pointer}
.info .t{font-size:13px;font-weight:600}.info .s{font-size:11px;color:var(--mute)}
.hint{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(6,8,15,.62);backdrop-filter:blur(8px)}
.hint .box{text-align:center;max-width:460px;padding:24px}
.hint h3{font-size:28px;margin:10px 0 8px}
svg.flow{width:min(860px,100%);margin-top:16px;filter:drop-shadow(0 12px 30px #0006)}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}.dots,.info{display:none}.slide{align-items:flex-end}.inner{padding-bottom:12px}}
</style>
</head>
<body>
<div class="top"><div class="brand"><span class="dot"></span> GRUPO JET · WR At Home</div><div class="meta" id="chap">01 · Abertura</div></div>
<div class="dots" id="dots"></div>
<div class="prog"><i id="pfill"></i></div>
<div class="stage" id="stage"></div>
<div class="player">
  <button class="navbtn" onclick="jump(-1)" aria-label="Anterior">‹</button>
  <button class="play" id="playBtn" onclick="toggle()">▶</button>
  <button class="navbtn" onclick="jump(1)" aria-label="Próximo">›</button>
  <div class="info"><div class="t">Narração · WR At Home</div><div class="s" id="status">Clique para começar</div></div>
  <div class="seek" onclick="seekTo(event)"><i id="sfill"></i></div>
  <div class="time" id="time">0:00 / 1:26</div>
</div>
<div class="hint" id="hint">
  <div class="box">
    <div class="k">Grupo Jet</div>
    <h3>Acompanhe com o áudio</h3>
    <p class="lede" style="margin:0 auto 20px">Os slides mudam sozinhos com a narração. Você pode pausar, voltar ou pular.</p>
    <button class="play" style="width:auto;padding:0 22px;border-radius:999px;font-size:15px" onclick="start()">▶ Começar apresentação</button>
  </div>
</div>
<audio id="audio" preload="auto" src="https://cdn.kairogen.ai/audio-generations/6a9f53f0283c2ce5cb1b23c5/6ab15bcb79777cb49531d9e4/speech.mp3"></audio>
<script>
const FLOW = `<svg class="flow" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="300" rx="16" fill="#0c1424"/>
  <rect x="24" y="50" width="150" height="110" rx="12" fill="#152033" stroke="#3b82f6"/>
  <text x="99" y="92" text-anchor="middle" fill="#fff" font-size="13" font-family="Inter">Estúdio WR</text>
  <text x="99" y="112" text-anchor="middle" fill="#93a0b5" font-size="11" font-family="Inter">câmera + áudio</text>
  <path d="M174 88 H250" stroke="#ff6a00" stroke-width="3"/>
  <circle cx="250" cy="88" r="5" fill="#ff6a00"/>
  <text x="200" y="78" fill="#ff8a33" font-size="10" font-family="Inter">Fibra 1</text>
  <path d="M174 114 H250" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="250" cy="114" r="5" fill="#38bdf8"/>
  <text x="200" y="132" fill="#38bdf8" font-size="10" font-family="Inter">Fibra 2</text>
  <path d="M174 140 H250" stroke="#22c55e" stroke-width="3" stroke-dasharray="4 3"/>
  <circle cx="250" cy="140" r="5" fill="#22c55e"/>
  <text x="200" y="158" fill="#4ade80" font-size="10" font-family="Inter">Starlink</text>
  <rect x="268" y="50" width="180" height="120" rx="12" fill="#152033" stroke="#ff6a00"/>
  <text x="358" y="88" text-anchor="middle" fill="#fff" font-size="13" font-family="Inter">Datacenter Jet</text>
  <text x="358" y="108" text-anchor="middle" fill="#93a0b5" font-size="11" font-family="Inter">origin · ABR</text>
  <text x="358" y="126" text-anchor="middle" fill="#93a0b5" font-size="11" font-family="Inter">1080 / 720 / 480</text>
  <text x="358" y="150" text-anchor="middle" fill="#4ade80" font-size="10" font-family="Inter">failover automático</text>
  <path d="M448 88 H520" stroke="#3b82f6" stroke-width="3"/>
  <rect x="520" y="40" width="140" height="70" rx="12" fill="#152033" stroke="#22c55e"/>
  <text x="590" y="70" text-anchor="middle" fill="#fff" font-size="13" font-family="Inter">Player</text>
  <text x="590" y="88" text-anchor="middle" fill="#93a0b5" font-size="11" font-family="Inter">aluno em casa</text>
  <path d="M448 130 H520" stroke="#22c55e" stroke-width="3"/>
  <rect x="520" y="126" width="140" height="70" rx="12" fill="#152033" stroke="#22c55e"/>
  <text x="590" y="156" text-anchor="middle" fill="#fff" font-size="13" font-family="Inter">Gravação</text>
  <text x="590" y="174" text-anchor="middle" fill="#93a0b5" font-size="11" font-family="Inter">fallback ao vivo</text>
  <path d="M358 170 V210 H720 V88" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="720" y="54" width="116" height="80" rx="12" fill="#10261a" stroke="#22c55e"/>
  <text x="778" y="88" text-anchor="middle" fill="#fff" font-size="12" font-family="Inter">Digital Ocean</text>
  <text x="778" y="108" text-anchor="middle" fill="#4ade80" font-size="11" font-family="Inter">disaster recover</text>
  <text x="24" y="270" fill="#93a0b5" font-size="12" font-family="Inter">Três caminhos independentes: Fibra 1, Fibra 2 e Starlink. Se um cair, os outros assumem.</text>
</svg>`;
const DATA = [
  {t:0,l:"01 · Abertura",bg:"https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=1600&q=70",h1:1,title:"Streaming próprio para o WR At Home.",lede:"Do estúdio do Colégio WR até a casa do aluno — sem travar, sem tela preta, sem depender da Spalla.",cap:"Olá, Saulo. Aqui está a proposta do Grupo Jet para o Colégio WR At Home."},
  {t:8,l:"02 · Percurso",bg:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=70",title:"Do estúdio até o aluno em casa.",lede:"A aula sai do Colégio WR, entra no datacenter do Grupo Jet e chega no celular ou no notebook do aluno.",cap:"Vamos mostrar como a solução funciona, do estúdio até o aluno em casa."},
  {t:16,l:"03 · Topologia",bg:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1600&q=70",full:1,title:"Três caminhos. Um sinal.",lede:"O sinal sai do estúdio por duas fibras e por Starlink ao mesmo tempo. Se um oscila, os outros assumem em segundos.",flow:1,cap:"O sinal sai do estúdio do Colégio WR por três caminhos independentes: duas fibras e um backup via Starlink."},
  {t:28,l:"04 · Failover",bg:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1600&q=70",title:"Se um caminho cair, os outros assumem.",lede:"Hoje, na Spalla, o segundo sinal não inicia. Aqui os três caminhos estão vivos o tempo todo.",cards:[["t-amber","Ingest A","Fibra 1","Caminho primário no datacenter do Grupo Jet."],["t-sky","Ingest B","Fibra 2","Segunda fibra, rota independente."],["t-green","Ingest C","Starlink","Backup via satélite. Assume sozinho."]],cap:"Se a Fibra 1 oscilar, a Fibra 2 ou o Starlink assumem em segundos, sem o aluno perceber."},
  {t:38,l:"05 · Qualidade",bg:"https://images.unsplash.com/photo-1544197150-b99a5804f82b?auto=format&fit=crop&w=1600&q=70",title:"Várias qualidades ao mesmo tempo.",lede:"No datacenter do Grupo Jet o origin gera 1080p, 720p e 480p em tempo real. O player escolhe a melhor para cada conexão.",g3:1,cards:[["t-blue","1080p","Fibra boa","Quem tem banda assiste em alta."],["t-blue","720p","Média","Cai um pouco, a qualidade desce sozinha."],["t-blue","480p","3G / Wi-Fi fraco","A aula continua. Sem tela preta."]],cap:"Um servidor de origem faz a transcodificação adaptativa. O player escolhe a melhor qualidade para cada conexão."},
  {t:52,l:"06 · Gravação",bg:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=70",title:"Se o ao vivo cair, a aula não para.",lede:"Toda aula grava automaticamente, em paralelo. Se o stream cair de vez, o aluno cai na versão gravada.",cards:[["t-green","Ao vivo","Stream principal","Chat, qualidade adaptativa, monitoramento."],["t-green","Fallback","Gravação instantânea","O player troca sozinho. A aula segue."]],cap:"Toda aula grava automaticamente. Se o stream cair de vez, o aluno cai na gravação sem interrupção."},
  {t:62,l:"07 · Disaster recovery",bg:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1600&q=70",full:1,title:"Se o local cair, a Digital Ocean assume.",lede:"Replicação contínua do stream. Snapshot horário das gravações. O DNS redireciona. O aluno nem percebe.",flow:1,cap:"Replicamos tudo na Digital Ocean. Se o datacenter local cair, o DNS redireciona e a aula segue de lá."},
  {t:73,l:"08 · Comercial",bg:"https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1600&q=70",price:1,lede:"Mínimo mensal que cobre a infraestrutura. Em cima, taxa por aluno ativo.",cap:"Um mínimo mensal cobre nossa infraestrutura, mais uma taxa por aluno ativo. Assim vocês nunca ficam no vermelho."},
  {t:82,l:"09 · Cronograma",bg:"https://images.unsplash.com/photo-1524178232363-1fb2b075b622?auto=format&fit=crop&w=1600&q=70",title:"MVP em quinze dias.",lede:"Testado com uma turma piloto antes de abrir para todos. Go-live completo em cerca de 25 dias.",g3:1,cards:[["t-jet","Dias 1–15","MVP","Ingest, origin, player e gravação no ar."],["t-jet","+5 dias","Piloto","Uma turma real valida a experiência."],["t-jet","+5 dias","Go-live","Ajustes e abertura para todas as turmas."]],cap:"O MVP fica pronto em quinze dias, testado com uma turma piloto. Qualquer dúvida, é só falar."}
];
const stage=document.getElementById("stage");
DATA.forEach((s,i)=>{
  const el=document.createElement("section");
  el.className="slide"+(i===0?" on":"");
  let extra="";
  if(s.flow) extra+=FLOW;
  if(s.cards) extra+=`<div class="grid ${s.g3?"g3":"g2"}" style="max-width:${s.g3?760:640}px">${s.cards.map(c=>`<div class="card"><span class="tag ${c[0]}">${c[1]}</span><h3>${c[2]}</h3><p>${c[3]}</p></div>`).join("")}</div>`;
  if(s.price) extra=`<div class="price">R$ 7.800 <small>/mês · piso</small></div><p class="lede" style="margin-top:10px">${s.lede}</p><div class="card" style="max-width:520px;margin-top:16px"><div class="pill"><span>Piso equivalente a</span><b>1.000 alunos</b></div><div class="pill"><span>Por aluno acima do piso</span><b>R$ 5 a R$ 10</b></div><div class="pill"><span>Com 3.000 alunos</span><b>~ R$ 24 mil / mês</b></div><div class="pill"><span>Hardware inicial</span><b>~ R$ 78 mil</b></div></div>`;
  const heading=s.price?"":(s.h1?`<h1>${s.title}</h1>`:`<h2>${s.title}</h2>`);
  const lede=s.price?"":`<p class="lede">${s.lede}</p>`;
  el.innerHTML=`<div class="bg" style="background-image:url('${s.bg}')"></div><div class="veil${s.full?" full":""}"></div><div class="inner"><div class="k">${s.l}</div>${heading}${lede}${extra}<div class="caption">${s.cap}</div></div>`;
  stage.appendChild(el);
});
const slides=[...document.querySelectorAll(".slide")];
const times=DATA.map(s=>s.t);
const audio=document.getElementById("audio");
const playBtn=document.getElementById("playBtn");
const sfill=document.getElementById("sfill");
const pfill=document.getElementById("pfill");
const timeEl=document.getElementById("time");
const statusEl=document.getElementById("status");
const chap=document.getElementById("chap");
const dots=document.getElementById("dots");
let idx=0,dur=86.18;
DATA.forEach((s,i)=>{const b=document.createElement("button");b.title=s.l;b.onclick=()=>go(i,true);dots.appendChild(b);});
function fmt(s){s=Math.max(0,s||0);return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
function cur(t){let i=0;for(let k=0;k<times.length;k++) if(t>=times[k]-0.04) i=k;return i}
function go(i,seekA){idx=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.classList.toggle("on",n===idx));[...dots.children].forEach((d,n)=>d.classList.toggle("on",n===idx));chap.textContent=DATA[idx].l;if(seekA){audio.currentTime=times[idx]+0.05;if(audio.paused)toggle();}}
function toggle(){if(audio.paused){audio.play();playBtn.textContent="⏸";statusEl.textContent="Reproduzindo";}else{audio.pause();playBtn.textContent="▶";statusEl.textContent="Pausado";}}
function start(){document.getElementById("hint").style.display="none";audio.play();playBtn.textContent="⏸";statusEl.textContent="Reproduzindo";}
function jump(d){go(idx+d,true)}
function seekTo(e){const r=e.currentTarget.getBoundingClientRect();audio.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*dur}
audio.addEventListener("loadedmetadata",()=>{dur=audio.duration||86.18;timeEl.textContent="0:00 / "+fmt(dur)});
audio.addEventListener("timeupdate",()=>{const t=audio.currentTime,p=t/dur*100;sfill.style.width=p+"%";pfill.style.width=p+"%";timeEl.textContent=fmt(t)+" / "+fmt(dur);const n=cur(t);if(n!==idx)go(n,false)});
audio.addEventListener("ended",()=>{playBtn.textContent="▶";statusEl.textContent="Fim"});
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();toggle()}if(e.key==="ArrowRight")jump(1);if(e.key==="ArrowLeft")jump(-1)});
go(0,false);
</script>
</body>
</html>
